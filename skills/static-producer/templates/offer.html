<!-- Layout: offer / price. Slots: logo_html eyebrow headline_html subhead badge price compare_html price_note offer_list_html product_html cta_html terms footnote_html labels_html -->
<style>
.layout-offer .frame{background:
  radial-gradient(760px 640px at 78% 58%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 70%), var(--bg)}
.layout-offer .safe{gap:24px}
.of-top{display:flex;justify-content:space-between;align-items:center}
.of-main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1.05fr 1fr;gap:20px;align-items:center}
.of-left{display:flex;flex-direction:column;gap:26px;min-height:0}
.of-price{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.of-price .now{font-family:var(--font-head);font-size:132px;font-weight:900;letter-spacing:-.05em;line-height:.9;color:var(--primary)}
.of-price .compare{font-size:48px;font-weight:600;color:var(--muted);text-decoration:line-through;text-decoration-thickness:4px;text-decoration-color:color-mix(in srgb, var(--accent) 85%, black)}
.of-note{font-size:24px;font-weight:600;color:var(--muted);margin-top:-14px}
.of-left ul.ticks li{font-size:30px}
.of-right{position:relative;height:100%;min-height:0;display:flex;align-items:center;justify-content:center}
.of-right .product-mock{font-size:12.5px}
.size-square .of-right .product-mock{font-size:10.5px}
.of-right .product-img{max-height:520px}
.of-badge{position:absolute;top:4%;right:22px;width:200px;height:200px;border-radius:50%;background:var(--accent);color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:var(--font-head);font-weight:900;font-size:40px;line-height:.98;letter-spacing:-.02em;transform:rotate(10deg);padding:18px;z-index:3;
  box-shadow:0 0 0 10px color-mix(in srgb, var(--accent) 30%, transparent),0 14px 30px rgba(0,0,0,.18)}
.size-square .of-badge{width:170px;height:170px;font-size:34px}
.of-badge:empty{display:none}
.of-foot{display:flex;align-items:center;gap:26px}
.of-terms{font-size:21px;font-weight:600;color:var(--muted);line-height:1.3}
</style>
<div class="safe" data-fit-box>
  <div class="of-top">{{logo_html}}<span class="eyebrow">{{eyebrow}}</span></div>
  <h1 class="headline" data-fit>{{headline_html}}</h1>
  <div class="of-main">
    <div class="of-left">
      <div class="of-price"><span class="now">{{price}}</span>{{compare_html}}</div>
      <div class="of-note">{{price_note}}</div>
      <ul class="ticks" data-fit>{{offer_list_html}}</ul>
    </div>
    <div class="of-right">{{product_html}}<div class="of-badge">{{badge}}</div></div>
  </div>
  <div class="of-foot">{{cta_html}}<div class="of-terms">{{terms}}</div></div>
  {{footnote_html}}
</div>
{{labels_html}}
