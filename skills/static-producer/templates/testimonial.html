<!-- Layout: testimonial / review. Slots: logo_html stars_html headline_html review_html reviewer reviewer_meta verified_html product_html cta_html footnote_html labels_html -->
<style>
.layout-testimonial .frame{background:
  radial-gradient(700px 600px at 100% 100%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%), var(--secondary)}
.layout-testimonial .safe{gap:26px}
.t-top{display:flex;justify-content:space-between;align-items:center}
.t-stars{display:flex;gap:6px;font-size:52px}
.t-quote{position:relative;font-family:var(--font-head);font-weight:850;font-size:80px;line-height:1.02;letter-spacing:-.035em;color:var(--ink);text-wrap:balance}
.t-quote::before{content:"\201C";position:absolute;left:-4px;top:-96px;font-size:150px;line-height:1;color:var(--accent);opacity:.9;font-weight:900}
.t-card{background:var(--surface);border-radius:28px;padding:34px 38px;box-shadow:0 18px 40px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:22px;margin-right:220px}
.size-square .t-card{margin-right:250px}
.t-body{font-size:31px;line-height:1.36;font-weight:500;color:var(--ink)}
.t-who{display:flex;align-items:center;gap:16px;font-size:24px}
.t-avatar{width:58px;height:58px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px}
.t-name{font-weight:800}
.t-meta{color:var(--muted);font-weight:500}
.t-verified{display:flex;align-items:center;gap:8px;color:var(--primary);font-weight:700;font-size:21px}
.t-verified .ic{font-size:24px}
.t-spacer{flex:1 1 auto}
.t-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.t-bottom .footnote{max-width:520px;margin-top:14px}
.t-product{position:absolute;right:56px;bottom:calc(var(--safe-b) + 40px);z-index:2}
.t-product .product-mock{font-size:12px}
.t-product .product-img{max-height:420px;max-width:380px}
.size-square .t-product .product-mock{font-size:10.5px}
</style>
<div class="safe" data-fit-box>
  <div class="t-top">{{logo_html}}<div class="t-stars">{{stars_html}}</div></div>
  <div style="height:56px;flex:none"></div>
  <h1 class="t-quote" data-fit>{{headline_html}}</h1>
  <div class="t-card">
    <p class="t-body" data-fit>{{review_html}}</p>
    <div class="t-who"><div class="t-avatar">{{reviewer}}</div><div><div class="t-name">{{reviewer}}</div><div class="t-meta">{{reviewer_meta}}</div></div></div>
    <div class="t-verified">{{verified_html}}</div>
  </div>
  <div class="t-spacer"></div>
  <div class="t-bottom"><div>{{cta_html}}{{footnote_html}}</div></div>
</div>
<div class="t-product">{{product_html}}</div>
{{labels_html}}
<script>
  // avatar shows initial only
  document.querySelectorAll('.t-avatar').forEach(a => a.textContent = (a.textContent.trim()[0] || '').toUpperCase());
</script>
