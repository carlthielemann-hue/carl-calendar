<!-- Layout: comparison chart. Slots: logo_html eyebrow headline_html subhead us_label them_label rows_html stat_html product_html cta_html footnote_html labels_html -->
<style>
.layout-comparison .safe{gap:22px}
.cmp-top{display:flex;justify-content:space-between;align-items:center}
.cmp-table{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--surface);border-radius:28px;padding:0 0 8px;
  box-shadow:0 18px 40px rgba(0,0,0,.08);overflow:hidden}
.cmp-head,.crow{display:grid;grid-template-columns:1fr 210px 210px;align-items:center}
.size-square .cmp-head,.size-square .crow{grid-template-columns:1fr 190px 190px}
.cmp-head{height:150px;flex:none}
.cmp-head .us-h{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;padding-bottom:16px;background:var(--primary);color:var(--on-primary);font-weight:800;font-size:24px;letter-spacing:.02em;text-align:center}
.cmp-head .us-h .product-mock{font-size:3.6px}
.cmp-head .us-h .product{height:96px}
.cmp-head .us-h .product-img{height:96px}
.cmp-head .them-h{align-self:end;padding-bottom:18px;text-align:center;font-weight:700;font-size:24px;color:var(--muted)}
.crow{flex:1 1 0;min-height:70px;border-top:1px solid color-mix(in srgb, var(--ink) 8%, transparent)}
.crow .clabel{padding:0 28px 0 34px;font-size:31px;font-weight:650;line-height:1.15;letter-spacing:-.01em}
.crow .cus,.crow .cthem{height:100%;display:flex;align-items:center;justify-content:center;font-size:46px}
.crow .cus{background:color-mix(in srgb, var(--primary) 9%, var(--surface))}
.cell-text{font-size:24px;font-weight:700}
.stat{font-size:26px;line-height:1.3;font-weight:600;color:var(--ink)}
.stat .hl{font-weight:850;color:var(--primary)}
.cmp-foot{display:flex;flex-direction:column;gap:14px}
</style>
<div class="safe" data-fit-box>
  <div class="cmp-top">{{logo_html}}<span class="eyebrow">{{eyebrow}}</span></div>
  <h1 class="headline" data-fit>{{headline_html}}</h1>
  <p class="subhead" data-fit>{{subhead}}</p>
  <div class="cmp-table">
    <div class="cmp-head"><div></div><div class="us-h">{{product_html}}<span>{{us_label}}</span></div><div class="them-h">{{them_label}}</div></div>
    {{rows_html}}
  </div>
  {{stat_html}}
  <div class="cmp-foot">{{cta_html}}{{footnote_html}}</div>
</div>
{{labels_html}}
